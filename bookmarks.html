<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>북마크 — 데이코스</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar" id="sidebar"></nav>

  <header class="header">
    <button class="header-menu" id="sidebarToggle" aria-label="메뉴">☰</button>
    <a class="header-title" href="/">데이코스</a>
    <div class="header-right">
      <button id="headerCreateBtn" style="display:none" aria-label="코스 만들기">+</button>
    </div>
  </header>

  <main class="page-wrap" style="padding-bottom:40px">
    <div class="spinner-wrap" id="spinner"><div class="spinner"></div></div>

    <div class="feed-grid" id="bookmarkGrid" style="padding-top:12px"></div>

    <div class="empty-state" id="bookmarkEmpty" style="display:none">
      <p>북마크한 코스가 없어요</p>
      <small>코스 상세 페이지에서 북마크를 추가해보세요</small>
    </div>

    <div class="infinite-sentinel" id="sentinel"></div>
  </main>

  <div class="toast" id="toast"></div>
  <script type="module" src="bookmarks.js"></script>
</body>
</html>
