    <!-- 코스 이름 + 소개글 -->
    <div class="create-section">
      <input type="text" id="courseName" class="course-name-input" placeholder="코스 이름을 입력하세요" maxlength="40"/>
      <textarea id="courseDesc" class="course-desc-input" placeholder="코스 소개글 (선택)" maxlength="200" rows="2"></textarea>
    </div>

    <!-- 지역 태그 -->
    <div class="create-section">
      <div class="section-title">📍 지역 태그 <span class="required">*</span></div>
      <div class="region-row">
        <select id="regionMain" class="region-select">
          <option value="">대분류 선택</option>
          <option>서울</option><option>경기</option><option>인천</option>
          <option>부산</option><option>대구</option><option>대전</option>
          <option>광주</option><option>울산</option><option>세종</option>
          <option>강원</option><option>충북</option><option>충남</option>
          <option>전북</option><option>전남</option><option>경북</option>
          <option>경남</option><option>제주</option>
        </select>
        <select id="regionSub" class="region-select" style="display:none">
          <option value="">세부 선택</option>
        </select>
      </div>
    </div>

    <!-- 지도 -->
    <div class="create-section">
      <div class="map-search-row">
        <input type="text" id="placeSearch" class="map-search-input" placeholder="장소 검색…"/>
        <button class="map-search-btn" id="placeSearchBtn">검색</button>
      </div>
      <div style="position:relative;">
        <div id="map" style="height:300px; border-radius:12px; margin-top:8px;"></div>
        <button class="map-location-btn" id="myLocationBtn" title="내 위치">📍</button>
      </div>
      <div id="searchResults" class="search-results"></div>
    </div>

    <!-- 장소 미리보기 패널 -->

    </div>
