<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>코스 만들기 — 데이코스</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="create.css"/>
  <script type="text/javascript"
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=725e3b5f43c47c651837511245861cc8&libraries=services&autoload=false">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" defer></script>
</head>
<body>
  <header class="header">
    <button class="header-menu" onclick="history.back()" aria-label="뒤로"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <a class="header-title" href="main.html">데이코스</a>
    <div class="header-right">
      <button class="draft-save-btn" id="draftSaveBtn" aria-label="임시저장">임시저장</button>
    </div>
  </header>

  <main class="create-page">

    <!-- 1. 썸네일 + 코스 이름 + 소개글 -->
    <div class="create-card">
      <!-- 썸네일 업로드 -->
      <div class="create-thumbnail-wrap" id="thumbnailWrap">
        <div class="create-thumbnail-placeholder" id="thumbnailPlaceholder">
          <span class="create-thumbnail-label">썸네일 영역</span>
        </div>
        <img id="thumbnailPreview" class="create-thumbnail-preview" style="display:none"/>
        <button class="create-thumbnail-remove" id="thumbnailRemoveBtn" style="display:none" aria-label="사진 제거">✕</button>
        <input type="file" id="thumbnailInput" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;"/>
      </div>
      <div class="create-divider"></div>
      <input
        type="text"
        id="courseName"
        class="create-title-input"
        placeholder="코스 이름을 입력하세요"
        maxlength="40"
        autocomplete="off"
      />
      <div class="create-divider"></div>
      <textarea
        id="courseDesc"
        class="create-desc-input"
        placeholder="코스 소개글 (선택)"
        maxlength="150"
        rows="2"
      ></textarea>
      <div style="text-align:right;font-size:11px;color:#aaa;margin-top:4px">
        <span id="descCount">0</span>/150
      </div>
    </div>

    <!-- 2. 지역 태그 -->
    <div class="create-card">
      <div class="create-card-label"> 지역 태그 <span class="required">*</span></div>
      <div class="create-region-row">
        <select id="regionMain" class="create-select" aria-label="지역">
          <option value="">대분류 선택</option>
          <option>서울</option><option>경기</option><option>인천</option>
          <option>부산</option><option>대구</option><option>대전</option>
          <option>광주</option><option>울산</option><option>세종</option>
          <option>강원</option><option>충북</option><option>충남</option>
          <option>전북</option><option>전남</option><option>경북</option>
          <option>경남</option><option>제주</option>
        </select>
        <select id="regionSub" class="create-select" style="display:none" aria-label="세부 지역"></select>
      </div>
    </div>

    <!-- 3. 장소 검색 + 지도 -->
    <div class="create-card create-map-card">
      <div class="create-search-wrap">
        <input
          type="text"
          id="searchInput"
          class="create-search-input"
          placeholder="장소 검색…"
          autocomplete="off"
        />
        <button class="create-search-btn" id="searchBtn" aria-label="검색">검색</button>
        <!-- 키워드 검색 결과 (오버레이) -->
        <ul class="create-search-results" id="keywordResults" style="display:none"></ul>
      </div>

      <div style="position:relative">
        <div id="createMap" class="create-map"></div>
        <button class="map-location-btn" id="myLocationBtn" title="내 위치"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></svg></button>
      </div>
    </div>

    <!-- 3-1. 지도 클릭 결과 + 직접입력 -->
    <div class="create-card" id="mapClickCard" style="display:none">
      <ul class="create-map-results" id="mapClickResults"></ul>
    </div>

    <!-- 4. 코스 목록 + 저장 버튼 -->
    <div class="create-card">
      <div class="create-list-header">
        <div class="create-card-label"> 코스 목록 <span class="create-place-count" id="placeCount">0곳</span></div>
        <button class="create-save-btn" id="saveBtn">저장하기</button>
      </div>
      <ul class="create-place-list" id="placeList"></ul>
      <div class="create-places-empty" id="placesEmpty">
        장소를 검색하거나 지도를 클릭해 추가하세요
      </div>
      <div class="create-total-time" id="totalTimeDisplay" style="display:none">
        ⏱ 총 소요시간 <strong id="totalTimeText"></strong>
      </div>
    </div>

  </main>

  <!-- 체류 시간 모달 -->
  <div class="modal-overlay" id="stayTimeModal">
    <div class="modal-box">
      <div class="modal-title" id="stayTimeModalTitle">체류 시간</div>
      <div class="time-chips" id="stayTimeChips">
        <button class="time-chip" data-min="10">10분</button>
        <button class="time-chip" data-min="20">20분</button>
        <button class="time-chip" data-min="30">30분</button>
        <button class="time-chip" data-min="60">1시간</button>
        <button class="time-chip" data-min="90">1시간 30분</button>
        <button class="time-chip" data-min="120">2시간</button>
        <button class="time-chip" data-min="150">2시간 30분</button>
        <button class="time-chip" data-min="180">3시간</button>
        <button class="time-chip" data-min="240">4시간</button>
        <button class="time-chip" data-min="300">5시간 이상</button>
      </div>
    </div>
  </div>

  <!-- 이동 시간 모달 -->
  <div class="modal-overlay" id="travelTimeModal">
    <div class="modal-box">
      <div class="modal-title">이동 시간</div>
      <div class="time-chips" id="travelTimeChips">
        <button class="time-chip" data-min="5">5분</button>
        <button class="time-chip" data-min="10">10분</button>
        <button class="time-chip" data-min="15">15분</button>
        <button class="time-chip" data-min="20">20분</button>
        <button class="time-chip" data-min="30">30분</button>
        <button class="time-chip" data-min="45">45분</button>
        <button class="time-chip" data-min="60">1시간</button>
        <button class="time-chip" data-min="90">1시간 30분</button>
        <button class="time-chip" data-min="120">2시간</button>
        <button class="time-chip" data-min="180">3시간 이상</button>
      </div>
    </div>
  </div>

  <!-- 사진 업로드 안내 모달 -->
  <div class="modal-overlay" id="photoRequiredModal">
    <div class="modal-box photo-required-modal-box">
      <div class="modal-title">사진을 업로드해주세요</div>
      <div class="photo-required-modal-desc">썸네일을 제외한 코스 사진은 각 장소마다 1장씩 필요합니다.</div>
      <button class="create-search-btn photo-required-confirm-btn" id="photoRequiredConfirmBtn" type="button">확인</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script type="module" src="create.js"></script>
</body>
</html>
