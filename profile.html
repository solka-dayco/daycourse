<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>마이페이지 — 데이코스</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="profile.css"/>
  <style>
    /* 마이페이지 내 코스 계획 탭 */
    .plan-profile-header {
      padding: 12px 16px 4px;
      text-align: right;
    }
    .plan-profile-link {
      font-size: 12px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .plan-list {
      list-style: none;
    }
    .plan-list-item {
      display: flex;
      flex-direction: column;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--transition);
    }
    .plan-list-item:first-child { border-top: 1px solid var(--border); }
    .plan-list-item:hover { background: var(--bg-section); }
    .plan-item-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .plan-item-desc {
      font-size: 13px;
      color: var(--sub);
      line-height: 1.5;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .plan-item-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-light);
    }
    .plan-item-meta-dot { color: var(--border-dark); }
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar" id="sidebar"></nav>

  <header class="header">
    <button class="header-menu" id="sidebarToggle" aria-label="메뉴">☰</button>
    <a class="header-title" href="/">데이코스</a>
    <div class="header-right">
      <button id="headerCreateBtn" style="display:none" aria-label="코스 만들기">+</button>
    </div>
  </header>

  <main class="page-wrap" style="padding-bottom:60px">
    <div class="spinner-wrap" id="spinner"><div class="spinner"></div></div>

    <div id="profileContent" style="display:none">

      <!-- 내 정보 -->
      <div class="profile-info-section">
        <div class="profile-avatar" id="profileAvatar" style="cursor:pointer"></div>
        <input type="file" id="profileImageInput" accept="image/*" style="display:none"/>
        <div class="profile-meta">
          <div class="profile-nickname-wrap">
            <div class="profile-nickname" id="profileNickname"></div>
            <button class="profile-edit-icon" id="nicknameEditBtn" aria-label="닉네임 수정">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
          </div>
          <input class="profile-nickname-input" id="nicknameInput" style="display:none" maxlength="20"/>
          <div class="profile-bio" id="profileBio"></div>
          <div class="profile-level" id="profileLevel"></div>
          <div class="profile-xp-bar-wrap" id="profileXpWrap" style="display:none">
            <div class="profile-xp-bar-bg">
              <div class="profile-xp-bar-fill" id="profileXpFill"></div>
            </div>
            <div class="profile-xp-label" id="profileXpLabel"></div>
          </div>
        </div>
        <div class="profile-stats">
          <div class="profile-stat">
            <span class="profile-stat-num" id="statCourses">0</span>
            <span class="profile-stat-label">코스</span>
          </div>
          <div class="profile-stat-div"></div>
          <div class="profile-stat">
            <span class="profile-stat-num" id="statFollowers">0</span>
            <span class="profile-stat-label">팔로워</span>
          </div>
          <div class="profile-stat-div"></div>
          <div class="profile-stat">
            <span class="profile-stat-num" id="statFollowing">0</span>
            <span class="profile-stat-label">팔로잉</span>
          </div>
        </div>
        <a id="viewPublicPage" href="#" class="profile-public-btn">공개 프로필 보기</a>
      </div>

      <!-- 구분선 -->
      <div class="profile-divider"></div>

      <!-- 활동 탭 -->
      <div class="activity-tab-bar">
        <button class="activity-tab active" data-tab="myCourse">✏️ 내 코스</button>
        <button class="activity-tab" data-tab="bookmark">🔖 북마크</button>
        <button class="activity-tab" data-tab="liked">♥ 좋아요</button>
        <button class="activity-tab" data-tab="plan">🗓 코스 계획</button>
      </div>

      <!-- 좋아요한 코스 -->
      <div class="activity-panel" id="panel-liked" style="display:none">
        <div class="feed-grid" id="likedGrid"></div>
        <div class="spinner-wrap" id="likedSpinner" style="display:none"><div class="spinner spinner-sm"></div></div>
        <div class="activity-empty" id="likedEmpty" style="display:none">
          <p>좋아요한 코스가 없어요</p>
        </div>
        <div class="infinite-sentinel" id="likedSentinel"></div>
      </div>

      <!-- 북마크한 코스 -->
      <div class="activity-panel" id="panel-bookmark" style="display:none">
        <div class="feed-grid" id="bookmarkGrid"></div>
        <div class="spinner-wrap" id="bookmarkSpinner" style="display:none"><div class="spinner spinner-sm"></div></div>
        <div class="activity-empty" id="bookmarkEmpty" style="display:none">
          <p>북마크한 코스가 없어요</p>
        </div>
        <div class="infinite-sentinel" id="bookmarkSentinel"></div>
      </div>

      <!-- 내가 만든 코스 -->
      <div class="activity-panel" id="panel-myCourse">
        <div class="feed-grid" id="myCourseGrid"></div>
        <div class="spinner-wrap" id="myCourseSpinner" style="display:none"><div class="spinner spinner-sm"></div></div>
        <div class="activity-empty" id="myCourseEmpty" style="display:none">
          <p>만든 코스가 없어요</p>
          <small><a href="/create" style="color:var(--primary)">첫 코스 만들기 →</a></small>
        </div>
        <div class="infinite-sentinel" id="myCourseSentinel"></div>
      </div>

      <!-- 코스 계획 -->
      <div class="activity-panel" id="panel-plan" style="display:none">
        <div class="plan-profile-header">
          <a href="/plan" class="plan-profile-link">전체 보기 →</a>
        </div>
        <ul class="plan-list" id="planListProfile"></ul>
        <div class="spinner-wrap" id="planSpinner" style="display:none"><div class="spinner spinner-sm"></div></div>
        <div class="activity-empty" id="planEmpty" style="display:none">
          <p>코스 계획이 없어요</p>
          <small><a href="/create?mode=plan" style="color:var(--primary)">새 계획 만들기 →</a></small>
        </div>
        <div class="infinite-sentinel" id="planSentinel"></div>
      </div>

    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script type="module" src="profile.js"></script>
</body>
</html>
