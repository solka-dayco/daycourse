<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>닉네임 설정 — 데이코스</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
  <header class="header">
    <span class="header-title">데이코스</span>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>👋 환영합니다!</h1>
      <p style="text-align:center; font-size:14px; color:#888; margin-bottom:24px;">
        데이코스에서 사용할 닉네임을 설정해주세요.
      </p>

      <div id="authMsg" class="auth-msg"></div>

      <div class="auth-field">
        <label>닉네임</label>
        <input type="text" id="nicknameInput" placeholder="2~10자 입력" maxlength="10" autocomplete="off"/>
        <span class="field-hint">나중에 마이페이지에서 변경할 수 있습니다.</span>
        <span class="field-error" id="errNickname"></span>
      </div>

      <button class="auth-btn" id="confirmBtn">시작하기</button>
    </div>
  </div>

  <script type="module" src="nickname.js"></script>
</body>
</html>
