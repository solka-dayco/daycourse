<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>계정 관리 — 데이코스</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="auth.css"/>
  <link rel="icon" href="/image/favicon.png" type="image/png">
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar" id="sidebar"></nav>

  <header class="header">
    <button class="header-menu" id="sidebarToggle" aria-label="메뉴">☰</button>
    <a class="header-title" href="/">데이코스</a>
    <div class="header-right"></div>
  </header>

  <main class="page-wrap" style="padding-top: calc(var(--header-h) + 32px); padding-bottom: 60px;">
    <div class="auth-card" style="max-width:420px; margin:0 auto;">
      <div style="padding: 24px 24px 0;">
        <div class="auth-step-title">계정 관리</div>
        <div class="auth-step-desc" id="accountProviderDesc"></div>
      </div>

      <div style="padding: 8px 24px 24px; display:flex; flex-direction:column; gap:12px;">

        <div class="account-section">
          <div class="account-section-title">계정 전환</div>
          <button class="account-btn" id="switchAccountBtn">다른 계정으로 전환하기</button>
        </div>

        <div class="sidebar-divider" style="margin:4px 0"></div>

        <div class="account-section">
          <div class="account-section-title danger">위험 구역</div>
          <button class="account-btn danger" id="deleteAccountBtn">회원탈퇴</button>
          <p class="account-warn">탈퇴 시 모든 코스, 댓글, 좋아요 데이터가 영구 삭제되며 복구할 수 없습니다.</p>
        </div>

      </div>
    </div>
  </main>

  <!-- 회원탈퇴 확인 모달 -->
  <div class="modal-backdrop" id="deleteModal" style="display:none">
    <div class="modal-box">
      <div class="modal-title">정말 탈퇴하시겠어요?</div>
      <p class="modal-desc">계정과 모든 데이터가 즉시 삭제되며 복구가 불가능합니다.</p>
      <div class="auth-msg error" id="deleteMsg" style="display:none"></div>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="deleteCancelBtn">취소</button>
        <button class="modal-btn confirm" id="deleteConfirmBtn">탈퇴하기</button>
      </div>
    </div>
  </div>

  <script type="module" src="account.js"></script>
</body>
</html>
