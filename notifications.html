<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>알림 — 데이코스</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="notifications.css"/>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar" id="sidebar"></nav>

  <header class="header">
    <button class="header-menu" id="sidebarToggle" aria-label="메뉴">☰</button>
    <a class="header-title" href="main.html">데이코스</a>
    <div class="header-right">
      <button id="headerCreateBtn" style="display:none" aria-label="코스 만들기">+</button>
    </div>
  </header>

  <main class="page-wrap" style="padding-bottom:40px">
    <div class="spinner-wrap" id="spinner"><div class="spinner"></div></div>

    <div id="notifList" style="display:none"></div>

    <div class="empty-state" id="notifEmpty" style="display:none">
      <p>아직 알림이 없어요</p>
      <small>내 코스에 좋아요, 댓글, 참조가 생기면 알려드려요</small>
    </div>

    <div class="infinite-sentinel" id="sentinel"></div>
  </main>

  <div class="toast" id="toast"></div>
  <script type="module" src="notifications.js"></script>
</body>
</html>
