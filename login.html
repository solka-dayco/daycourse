<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>로그인 — 데이코스</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="auth.css"/>
  <link rel="icon" href="/image/favicon.png" type="image/png">
</head>
<body>
<div class="auth-page">
  <div class="auth-logo" onclick="location.href='/'">데이코스</div>
  <div class="auth-logo-sub">나만의 하루 코스를 만들어보세요</div>

  <div class="auth-card">
    <!-- 탭 -->
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">로그인</button>
      <button class="auth-tab" data-tab="signup">회원가입</button>
    </div>

    <!-- 로그인 패널 -->
    <div class="tab-panel active" id="panel-login">
      <div class="auth-msg" id="loginMsg"></div>

      <div class="auth-form-group">
        <label class="auth-label" for="loginUsername">아이디</label>
        <input
          type="text" id="loginUsername"
          class="auth-input"
          placeholder="영문/숫자 아이디"
          autocomplete="username"
          inputmode="email"
        />
      </div>
      <div class="auth-form-group">
        <label class="auth-label" for="loginPassword">비밀번호</label>
        <div class="input-password-wrap">
          <input
            type="password" id="loginPassword"
            class="auth-input"
            placeholder="비밀번호"
            autocomplete="current-password"
          />
          <button class="toggle-password" type="button" data-target="loginPassword" aria-label="비밀번호 표시">👁</button>
        </div>
      </div>

      <button class="auth-btn" id="loginBtn">로그인</button>

      <div class="auth-divider">또는</div>
      <button class="google-btn" id="googleLoginBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        구글로 계속하기
      </button>

      <div class="auth-footer">
        <a href="/find">아이디 / 비밀번호 찾기</a>
      </div>
    </div>

    <!-- 회원가입 패널 -->
    <div class="tab-panel" id="panel-signup">
      <div class="auth-msg" id="signupMsg"></div>

      <div class="auth-form-group">
        <label class="auth-label" for="signupUsername">아이디</label>
        <input
          type="text" id="signupUsername"
          class="auth-input"
          placeholder="영문 소문자 + 숫자, 4~20자"
          autocomplete="username"
          maxlength="20"
          inputmode="email"
        />
        <div class="field-error" id="errUsername"></div>
      </div>
      <div class="auth-form-group">
        <label class="auth-label" for="signupPassword">비밀번호</label>
        <div class="input-password-wrap">
          <input
            type="password" id="signupPassword"
            class="auth-input"
            placeholder="8자 이상, 영문+숫자 포함"
            autocomplete="new-password"
            maxlength="60"
          />
          <button class="toggle-password" type="button" data-target="signupPassword" aria-label="비밀번호 표시">👁</button>
        </div>
        <div class="field-error" id="errPassword"></div>
      </div>
      <div class="auth-form-group">
        <label class="auth-label" for="signupPasswordConfirm">비밀번호 확인</label>
        <div class="input-password-wrap">
          <input
            type="password" id="signupPasswordConfirm"
            class="auth-input"
            placeholder="비밀번호 다시 입력"
            autocomplete="new-password"
            maxlength="60"
          />
          <button class="toggle-password" type="button" data-target="signupPasswordConfirm" aria-label="비밀번호 표시">👁</button>
        </div>
        <div class="field-error" id="errPasswordConfirm"></div>
      </div>

      <div class="auth-agree">
        <input type="checkbox" id="agreeCheck"/>
        <label for="agreeCheck">
          <a href="/privacy" target="_blank">개인정보처리방침</a>에 동의합니다
        </label>
      </div>

      <button class="auth-btn" id="signupBtn">회원가입</button>

      <div class="auth-divider">또는</div>
      <button class="google-btn" id="googleSignupBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        구글로 계속하기
      </button>
    </div>
  </div>

  <div class="auth-footer" style="margin-top:16px">
    <span>로그인 없이 </span>
    <a href="/">둘러보기 →</a>
  </div>
</div>

<script type="module" src="login.js"></script>
</body>
</html>
