<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>로그인 — 데이코스</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
  <header class="header">
    <button class="header-menu" id="sidebarToggle">☰</button>
    <span class="header-title" onclick="location.href='main.html'">데이코스</span>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar" id="sidebar"></nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>🗺️ 데이코스</h1>

      <div id="authMsg" class="auth-msg"></div>

      <!-- 카카오 로그인 (추후 구현) -->
      <!-- <button class="auth-kakao-btn" id="kakaoLoginBtn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3C6.477 3 2 6.582 2 11.04c0 2.899 1.816 5.456 4.548 6.944-.2.74-.727 2.686-.832 3.105-.13.52.19.513.4.373.165-.11 2.616-1.777 3.676-2.498A11.47 11.47 0 0012 19.08c5.523 0 10-3.581 10-8.04C22 6.582 17.523 3 12 3z"/>
        </svg>
        카카오로 계속하기
      </button>

      <div class="auth-divider">또는</div> -->

      <!-- 이메일 탭 -->
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">로그인</div>
        <div class="auth-tab" data-tab="signup">회원가입</div>
      </div>

      <!-- 로그인 -->
      <div class="tab-panel active" id="panel-login">
        <div class="auth-field">
          <label>아이디</label>
          <input type="text" id="loginUsername" placeholder="아이디 입력" autocomplete="username"/>
        </div>
        <div class="auth-field">
          <label>비밀번호</label>
          <input type="password" id="loginPassword" placeholder="비밀번호 입력" autocomplete="current-password"/>
        </div>
        <button class="auth-btn" id="loginBtn">로그인</button>
        <div class="auth-footer">
          비밀번호를 잊으셨나요? <a href="find.html">찾기</a>
        </div>
      </div>

      <!-- 회원가입 -->
      <div class="tab-panel" id="panel-signup">
        <div class="auth-field">
          <label>아이디</label>
          <input type="text" id="signupUsername" placeholder="영문/숫자 4~20자" autocomplete="username"/>
          <span class="field-hint">영문 소문자, 숫자 조합 4~20자</span>
          <span class="field-error" id="errUsername"></span>
        </div>
        <div class="auth-field">
          <label>닉네임</label>
          <input type="text" id="signupNickname" placeholder="2~10자"/>
          <span class="field-error" id="errNickname"></span>
        </div>
        <div class="auth-field">
          <label>비밀번호</label>
          <input type="password" id="signupPassword" placeholder="6자 이상" autocomplete="new-password"/>
          <span class="field-error" id="errPassword"></span>
        </div>
        <div class="auth-field">
          <label>비밀번호 확인</label>
          <input type="password" id="signupPasswordConfirm" placeholder="비밀번호 재입력" autocomplete="new-password"/>
          <span class="field-error" id="errPasswordConfirm"></span>
        </div>
        <button class="auth-btn" id="signupBtn">가입하기</button>
      </div>
    </div>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
