<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>로그인 — 데이코스</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-logo" onclick="location.href='/'">데이코스</div>
  <div class="auth-logo-sub">나만의 하루 코스를 만들어보세요</div>

  <div class="auth-card">
    <!-- 탭 -->
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">로그인</button>
      <button class="auth-tab" data-tab="signup">회원가입</button>
    </div>

    <!-- 로그인 패널 -->
    <div class="tab-panel active" id="panel-login">
      <div class="auth-msg" id="loginMsg"></div>

      <div class="auth-form-group">
        <label class="auth-label" for="loginUsername">아이디</label>
        <input
          type="text" id="loginUsername"
          class="auth-input"
          placeholder="영문/숫자 아이디"
          autocomplete="username"
          inputmode="email"
        />
      </div>
      <div class="auth-form-group">
        <label class="auth-label" for="loginPassword">비밀번호</label>
        <div class="input-password-wrap">
          <input
            type="password" id="loginPassword"
            class="auth-input"
            placeholder="비밀번호"
            autocomplete="current-password"
          />
          <button class="toggle-password" type="button" data-target="loginPassword" aria-label="비밀번호 표시">👁</button>
        </div>
      </div>

      <button class="auth-btn" id="loginBtn">로그인</button>

      <!--
      <div class="auth-divider">또는</div>
      <button class="kakao-btn" id="kakaoLoginBtn">
        <span>💬</span> 카카오로 로그인
      </button>
      -->

      <div class="auth-footer">
        <a href="find.html">아이디 / 비밀번호 찾기</a>
      </div>
    </div>

    <!-- 회원가입 패널 -->
    <div class="tab-panel" id="panel-signup">
      <div class="auth-msg" id="signupMsg"></div>

      <div class="auth-form-group">
        <label class="auth-label" for="signupUsername">아이디</label>
        <input
          type="text" id="signupUsername"
          class="auth-input"
          placeholder="영문 소문자 + 숫자, 4~20자"
          autocomplete="username"
          maxlength="20"
          inputmode="email"
        />
        <div class="field-error" id="errUsername"></div>
      </div>
      <div class="auth-form-group">
        <label class="auth-label" for="signupPassword">비밀번호</label>
        <div class="input-password-wrap">
          <input
            type="password" id="signupPassword"
            class="auth-input"
            placeholder="6자 이상"
            autocomplete="new-password"
            maxlength="60"
          />
          <button class="toggle-password" type="button" data-target="signupPassword" aria-label="비밀번호 표시">👁</button>
        </div>
        <div class="field-error" id="errPassword"></div>
      </div>
      <div class="auth-form-group">
        <label class="auth-label" for="signupPasswordConfirm">비밀번호 확인</label>
        <div class="input-password-wrap">
          <input
            type="password" id="signupPasswordConfirm"
            class="auth-input"
            placeholder="비밀번호 다시 입력"
            autocomplete="new-password"
            maxlength="60"
          />
          <button class="toggle-password" type="button" data-target="signupPasswordConfirm" aria-label="비밀번호 표시">👁</button>
        </div>
        <div class="field-error" id="errPasswordConfirm"></div>
      </div>

      <div class="auth-agree">
        <input type="checkbox" id="agreeCheck"/>
        <label for="agreeCheck">
          <a href="privacy.html" target="_blank">개인정보처리방침</a>에 동의합니다
        </label>
      </div>

      <button class="auth-btn" id="signupBtn">회원가입</button>
    </div>
  </div>

  <div class="auth-footer" style="margin-top:16px">
    <span>로그인 없이 </span>
    <a href="index.html">둘러보기 →</a>
  </div>
</div>

<script type="module" src="login.js"></script>
</body>
</html>
