<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>아이디/비밀번호 찾기 — 데이코스</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="auth.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-logo" onclick="location.href='/'">데이코스</div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="findId">아이디 찾기</button>
      <button class="auth-tab" data-tab="findPw">비밀번호 재설정</button>
    </div>

    <!-- 아이디 찾기 -->
    <div class="tab-panel active" id="panel-findId">
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:18px;line-height:1.6">
        닉네임으로 아이디를 조회할 수 있습니다.
      </p>
      <div class="auth-msg" id="findIdMsg"></div>
      <div class="auth-form-group">
        <label class="auth-label" for="findNickname">닉네임</label>
        <input
          type="text" id="findNickname"
          class="auth-input"
          placeholder="가입 시 설정한 닉네임"
          maxlength="16"
        />
      </div>
      <button class="auth-btn" id="findIdBtn">아이디 찾기</button>
      <div id="findIdResult" style="display:none;margin-top:16px;padding:14px;background:var(--bg);border-radius:var(--radius-sm)">
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">찾은 아이디</div>
        <div id="foundUsername" style="font-size:18px;font-weight:700;color:var(--primary)"></div>
        <button class="auth-btn" style="margin-top:12px" onclick="location.href='/login'">
          로그인하러 가기
        </button>
      </div>
    </div>

    <!-- 비밀번호 재설정 -->
    <div class="tab-panel" id="panel-findPw">
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:18px;line-height:1.6">
        아이디를 입력하면 새 비밀번호로 변경할 수 있습니다.
      </p>
      <div class="auth-msg" id="findPwMsg"></div>

      <!-- 스텝 1: 아이디 입력 -->
      <div id="stepUsername">
        <div class="auth-form-group">
          <label class="auth-label" for="pwUsername">아이디</label>
          <input
            type="text" id="pwUsername"
            class="auth-input"
            placeholder="가입한 아이디"
            maxlength="20"
          />
        </div>
        <button class="auth-btn" id="verifyUsernameBtn">확인</button>
      </div>

      <!-- 스텝 2: 새 비밀번호 입력 -->
      <div id="stepNewPw" style="display:none">
        <div class="auth-form-group">
          <label class="auth-label" for="newPassword">새 비밀번호</label>
          <div class="input-password-wrap">
            <input
              type="password" id="newPassword"
              class="auth-input" placeholder="6자 이상"
              maxlength="60" autocomplete="new-password"
            />
            <button class="toggle-password" type="button" data-target="newPassword" aria-label="비밀번호 표시">👁</button>
          </div>
          <div class="field-error" id="errNewPw"></div>
        </div>
        <div class="auth-form-group">
          <label class="auth-label" for="newPasswordConfirm">새 비밀번호 확인</label>
          <div class="input-password-wrap">
            <input
              type="password" id="newPasswordConfirm"
              class="auth-input" placeholder="비밀번호 확인"
              maxlength="60" autocomplete="new-password"
            />
            <button class="toggle-password" type="button" data-target="newPasswordConfirm" aria-label="비밀번호 표시">👁</button>
          </div>
          <div class="field-error" id="errNewPwConfirm"></div>
        </div>
        <button class="auth-btn" id="resetPwBtn">비밀번호 변경</button>
      </div>
    </div>
  </div>

  <div class="auth-footer" style="margin-top:16px">
    <a href="/login">← 로그인으로 돌아가기</a>
  </div>
</div>

<script type="module" src="find.js"></script>
</body>
</html>
