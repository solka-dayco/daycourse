<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>코스 계획 — 데이코스</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="main.css"/>
  <link rel="stylesheet" href="plan.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar" id="sidebar"></nav>

  <header class="header">
    <button class="header-menu" id="sidebarToggle" aria-label="메뉴">☰</button>
    <a class="header-title" href="/">데이코스</a>
    <div class="header-right">
      <button id="headerCreateBtn" style="display:none" aria-label="코스 만들기">+</button>
    </div>
  </header>

  <main class="page-wrap">
    <div class="plan-page">

      <div class="plan-header">
        <h2 class="plan-title">코스 계획</h2>
        <button class="plan-new-btn" id="planNewBtn">+ 새 계획</button>
      </div>

      <div class="spinner-wrap" id="spinner" style="display:none">
        <div class="spinner"></div>
      </div>

      <div class="empty-state" id="planEmpty" style="display:none">
        <p>아직 코스 계획이 없어요</p>
        <small>+ 새 계획 버튼으로 미리 코스를 구성해보세요</small>
      </div>

      <ul class="plan-list" id="planList"></ul>
      <div class="infinite-sentinel" id="planSentinel"></div>

    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script type="module" src="plan.js"></script>
</body>
</html>
